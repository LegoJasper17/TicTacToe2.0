<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TicTacToe.com 🍂</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff7ed;
  background:
    radial-gradient(circle at 20% 10%,#5b2c16 0,transparent 30%),
    radial-gradient(circle at 80% 90%,#3d1f12 0,transparent 35%),
    linear-gradient(135deg,#160d08,#29140b 55%,#1b0e09);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
.leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.leaf{
  position:absolute;
  top:-50px;
  font-size:24px;
  opacity:.85;
  animation:fall linear infinite;
}
.leaf:nth-child(1){left:8%;animation-duration:8s;animation-delay:-2s}
.leaf:nth-child(2){left:22%;animation-duration:11s;animation-delay:-7s;font-size:18px}
.leaf:nth-child(3){left:39%;animation-duration:9s;animation-delay:-4s}
.leaf:nth-child(4){left:57%;animation-duration:12s;animation-delay:-9s;font-size:20px}
.leaf:nth-child(5){left:74%;animation-duration:10s;animation-delay:-5s}
.leaf:nth-child(6){left:91%;animation-duration:13s;animation-delay:-11s;font-size:19px}
@keyframes fall{
  0%{transform:translateY(-60px) rotate(0deg)}
  100%{transform:translateY(110vh) rotate(360deg)}
}
.container{
  width:min(92vw,470px);
  padding:30px 24px;
  border:1px solid #8b4a24;
  border-radius:28px;
  background:rgba(43,24,15,.92);
  box-shadow:0 25px 70px rgba(0,0,0,.45),0 0 35px rgba(234,88,12,.12);
  text-align:center;
  position:relative;
  z-index:2;
  backdrop-filter:blur(8px);
}
h1{
  font-size:clamp(2.2rem,10vw,3.5rem);
  margin-bottom:4px;
  letter-spacing:-2px;
  color:#fb923c;
  text-shadow:0 0 22px rgba(249,115,22,.25);
}
.subtitle{
  color:#d6a77a;
  margin-bottom:22px;
  font-size:.95rem;
}
.scores{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:20px;
}
.score{
  flex:1;
  max-width:150px;
  padding:10px;
  border-radius:14px;
  background:#3a2115;
  border:1px solid #70401f;
}
.score strong{display:block;font-size:1.4rem;color:#fdba74}
.score span{font-size:.8rem;color:#d6a77a}
.turn{
  margin-bottom:18px;
  font-weight:bold;
  color:#fed7aa;
}
.board{
  width:min(78vw,330px);
  aspect-ratio:1;
  margin:0 auto 22px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.cell{
  border:1px solid #85461f;
  border-radius:16px;
  background:linear-gradient(145deg,#412416,#2d180f);
  color:#fff7ed;
  font-size:clamp(2.8rem,14vw,4.4rem);
  font-weight:bold;
  cursor:pointer;
  transition:.15s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.cell:hover:not(:disabled){
  transform:scale(1.035);
  background:#4b2918;
  border-color:#f97316;
}
.cell:disabled{cursor:default}
.cell.x{color:#fb923c;text-shadow:0 0 18px rgba(251,146,60,.3)}
.cell.o{color:#facc15;text-shadow:0 0 18px rgba(250,204,21,.25)}
.cell.win{
  background:#5a2d15;
  border-color:#f59e0b;
  box-shadow:0 0 20px rgba(245,158,11,.25);
}
.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.action{
  border:0;
  border-radius:13px;
  padding:12px 18px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#ea580c,#c2410c);
  box-shadow:0 8px 20px rgba(194,65,12,.2);
  transition:.15s;
}
button.action:hover{transform:translateY(-2px);filter:brightness(1.08)}
button.secondary{background:#4a2a1a}
.footer{margin-top:18px;color:#9f7656;font-size:.75rem}
@media(max-width:400px){
  .container{padding:24px 16px}
  .board{gap:7px}
  .cell{border-radius:12px}
}
</style>
</head>
<body>
<div class="leaves" aria-hidden="true">
  <div class="leaf">🍂</div><div class="leaf">🍁</div><div class="leaf">🍂</div>
  <div class="leaf">🍁</div><div class="leaf">🍂</div><div class="leaf">🍁</div>
</div>

<main class="container">
  <h1>TicTacToe.com</h1>
  <div class="subtitle">🍁 Herbst-Edition 🍂</div>

  <div class="scores">
    <div class="score">
      <strong id="scoreX">0</strong>
      <span>Spieler 1 · X</span>
    </div>
    <div class="score">
      <strong id="scoreO">0</strong>
      <span>Spieler 2 · O</span>
    </div>
  </div>

  <div class="turn" id="turn">Spieler 1 ist dran</div>

  <div class="board" id="board">
    <button class="cell" data-index="0" aria-label="Feld 1"></button>
    <button class="cell" data-index="1" aria-label="Feld 2"></button>
    <button class="cell" data-index="2" aria-label="Feld 3"></button>
    <button class="cell" data-index="3" aria-label="Feld 4"></button>
    <button class="cell" data-index="4" aria-label="Feld 5"></button>
    <button class="cell" data-index="5" aria-label="Feld 6"></button>
    <button class="cell" data-index="6" aria-label="Feld 7"></button>
    <button class="cell" data-index="7" aria-label="Feld 8"></button>
    <button class="cell" data-index="8" aria-label="Feld 9"></button>
  </div>

  <div class="buttons">
    <button class="action" id="newRound">🍁 Neue Runde</button>
    <button class="action secondary" id="resetScore">Punkte zurücksetzen</button>
  </div>

  <div class="footer">Viel Spaß beim Spielen! 🍂</div>
</main>

<script>
const cells = [...document.querySelectorAll(".cell")];
const turnText = document.getElementById("turn");
const scoreX = document.getElementById("scoreX");
const scoreO = document.getElementById("scoreO");
const newRound = document.getElementById("newRound");
const resetScore = document.getElementById("resetScore");

let board = Array(9).fill("");
let currentPlayer = "X";
let gameOver = false;
let scores = {X:0,O:0};

const wins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function updateTurn(){
  turnText.textContent = gameOver ? turnText.textContent :
    `Spieler ${currentPlayer === "X" ? "1" : "2"} ist dran`;
}

function checkWinner(){
  for(const combo of wins){
    const [a,b,c] = combo;
    if(board[a] && board[a] === board[b] && board[a] === board[c]){
      return combo;
    }
  }
  return null;
}

function handleMove(e){
  const cell = e.currentTarget;
  const index = Number(cell.dataset.index);

  if(board[index] || gameOver) return;

  board[index] = currentPlayer;
  cell.textContent = currentPlayer;
  cell.classList.add(currentPlayer === "X" ? "x" : "o");

  const winner = checkWinner();

  if(winner){
    gameOver = true;
    winner.forEach(i => cells[i].classList.add("win"));
    scores[currentPlayer]++;
    scoreX.textContent = scores.X;
    scoreO.textContent = scores.O;
    turnText.textContent = `🎉 Spieler ${currentPlayer === "X" ? "1" : "2"} gewinnt!`;
    return;
  }

  if(board.every(Boolean)){
    gameOver = true;
    turnText.textContent = "🤝 Unentschieden!";
    return;
  }

  currentPlayer = currentPlayer === "X" ? "O" : "X";
  updateTurn();
}

function startRound(){
  board = Array(9).fill("");
  currentPlayer = "X";
  gameOver = false;

  cells.forEach(cell => {
    cell.textContent = "";
    cell.classList.remove("x","o","win");
  });

  updateTurn();
}

cells.forEach(cell => cell.addEventListener("click", handleMove));
newRound.addEventListener("click", startRound);
resetScore.addEventListener("click", () => {
  scores = {X:0,O:0};
  scoreX.textContent = "0";
  scoreO.textContent = "0";
  startRound();
});
</script>
</body>
</html>
