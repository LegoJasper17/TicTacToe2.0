<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TicTacToe.com</title>
<style>
:root{--bg:#0f1117;--card:#171a23;--line:#2b3040;--text:#f5f7fb;--muted:#9da5b5;--accent:#6c7cff;--accent2:#8d98ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top,#202642 0,#0f1117 48%);color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}
.app{width:min(520px,100%)}.brand{text-align:center;margin-bottom:22px}.brand h1{font-size:clamp(34px,9vw,52px);margin:0;font-weight:800;letter-spacing:-2px}.brand p{color:var(--muted);margin:6px 0 0}
.card{background:rgba(23,26,35,.94);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 20px 70px #0007}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:20px}.player{padding:12px;border-radius:16px;background:#11141c;border:1px solid var(--line);text-align:center}.player.active{border-color:var(--accent);box-shadow:0 0 0 2px #6c7cff22}.symbol{font-size:24px;font-weight:800}.name{font-size:13px;color:var(--muted);margin-top:2px}.points{font-size:25px;font-weight:800}.vs{color:var(--muted);font-weight:700}
.status{text-align:center;font-weight:700;font-size:18px;margin:4px 0 18px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:390px;margin:auto}.cell{aspect-ratio:1;border:0;border-radius:18px;background:#11141c;color:var(--text);font-size:clamp(46px,14vw,72px);font-weight:800;cursor:pointer;transition:.15s transform,.15s background}.cell:hover:not(:disabled){background:#1e2330;transform:translateY(-2px)}.cell:disabled{cursor:default}.cell.x{color:#7f8cff}.cell.o{color:#65d8bd}.cell.win{background:#252c43}
.controls{display:flex;gap:10px;margin-top:20px}.btn{flex:1;border:1px solid var(--line);background:#202532;color:var(--text);border-radius:14px;padding:13px 15px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn:hover{filter:brightness(1.08)}
.note{text-align:center;color:var(--muted);font-size:12px;margin:16px 0 0}
@media(max-width:400px){.card{padding:15px}.board{gap:7px}.cell{border-radius:14px}.controls{flex-direction:column}}
</style>
</head>
<body>
<main class="app">
  <header class="brand"><h1>TicTacToe.com</h1><p>Zwei Spieler. Ein Feld. Drei in einer Reihe.</p></header>
  <section class="card">
    <div class="score">
      <div class="player active" id="px"><div class="symbol">X</div><div class="name">Spieler 1</div><div class="points" id="sx">0</div></div>
      <div class="vs">VS</div>
      <div class="player" id="po"><div class="symbol">O</div><div class="name">Spieler 2</div><div class="points" id="so">0</div></div>
    </div>
    <div class="status" id="status">Spieler 1 ist am Zug</div>
    <div class="board" id="board" aria-label="Tic-Tac-Toe Spielfeld"></div>
    <div class="controls"><button class="btn primary" id="new">Neue Runde</button><button class="btn" id="reset">Punkte zurücksetzen</button></div>
    <p class="note">X beginnt. Wer zuerst drei gleiche Zeichen in einer Reihe hat, gewinnt.</p>
  </section>
</main>
<script>
const boardEl=document.getElementById('board'),statusEl=document.getElementById('status');
const px=document.getElementById('px'),po=document.getElementById('po'),sx=document.getElementById('sx'),so=document.getElementById('so');
let board=Array(9).fill(''),turn='X',gameOver=false,scores={X:0,O:0};
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function render(){
 boardEl.innerHTML='';
 board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell '+(v?v.toLowerCase():'');b.textContent=v;b.disabled=!!v||gameOver;b.onclick=()=>move(i);boardEl.appendChild(b)});
 px.classList.toggle('active',turn==='X'&&!gameOver);po.classList.toggle('active',turn==='O'&&!gameOver);
}
function result(){
 for(const line of wins){const[a,b,c]=line;if(board[a]&&board[a]===board[b]&&board[a]===board[c])return line}
 return null;
}
function move(i){
 if(gameOver||board[i])return;
 board[i]=turn;const win=result();
 if(win){gameOver=true;scores[turn]++;sx.textContent=scores.X;so.textContent=scores.O;statusEl.textContent=(turn==='X'?'Spieler 1':'Spieler 2')+' gewinnt!';win.forEach(i=>boardEl.children[i].classList.add('win'))}
 else if(board.every(Boolean)){gameOver=true;statusEl.textContent='Unentschieden!'}
 else{turn=turn==='X'?'O':'X';statusEl.textContent=(turn==='X'?'Spieler 1':'Spieler 2')+' ist am Zug'}
 render();if(win)win.forEach(i=>boardEl.children[i].classList.add('win'));
}
function newGame(){board=Array(9).fill('');turn='X';gameOver=false;statusEl.textContent='Spieler 1 ist am Zug';render()}
document.getElementById('new').onclick=newGame;
document.getElementById('reset').onclick=()=>{scores={X:0,O:0};sx.textContent=0;so.textContent=0;newGame()};
render();
</script>
</body>
</html>
